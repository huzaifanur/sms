<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Sender</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2329; --muted: #66707a; --line: #dfe3e8;
    --accent: #1f6feb; --accent-text: #fff; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --ok-bg: #dafbe1; --warn-bg: #fff8c5; --bad-bg: #ffebe9; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #98a2ad; --line: #2b323b;
      --accent: #4c8dff; --ok: #4ac26b; --warn: #d4a72c; --bad: #ff7b72;
      --ok-bg: #12301c; --warn-bg: #33290b; --bad-bg: #3a1618; --chip: #222831;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px 0 14px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  input[type=text], input[type=password], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
  button.primary, button.small { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.small { padding: 3px 10px; font-size: 13px; font-weight: 500; }
  button.ghost { background: none; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg ul { margin: 6px 0 0; padding-left: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.job { cursor: pointer; }
  tr.job:hover td { background: var(--chip); }
  .state { font-weight: 600; }
  .s-done, .s-delivered, .s-sent { color: var(--ok); }
  .s-paused, .s-queued, .s-running, .s-pending, .s-processed, .s-submitting { color: var(--warn); }
  .s-stopped, .s-failed, .s-expired, .s-cancelled { color: var(--bad); }
  .reason { color: var(--muted); font-size: 13px; }
  .detail td { background: var(--bg); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .hide-sm { }
  @media (max-width: 560px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>SMS Sender</h1>
    <div class="chips" id="status"></div>
    <a href="/docs" class="chip">API docs</a>
  </header>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="one" aria-selected="true">One number</button>
      <button class="tab" role="tab" data-tab="same" aria-selected="false">Same text</button>
      <button class="tab" role="tab" data-tab="each" aria-selected="false">Text per number</button>
    </div>

    <div data-panel="one">
      <label for="one-to">Number</label>
      <input type="text" id="one-to" inputmode="tel" placeholder="0300 1234567">
      <label for="one-body">Message</label>
      <textarea id="one-body" data-count="one-count"></textarea>
      <div class="hint" id="one-count"></div>
    </div>

    <div data-panel="same" hidden>
      <label for="same-to">Numbers</label>
      <textarea id="same-to" placeholder="One per line, or separated by commas"></textarea>
      <div class="hint" id="same-n"></div>
      <label for="same-body">Message</label>
      <textarea id="same-body" data-count="same-count"></textarea>
      <div class="hint" id="same-count"></div>
    </div>

    <div data-panel="each" hidden>
      <label for="each-lines">Number and message, one per line</label>
      <textarea id="each-lines" style="min-height:160px" placeholder="03001234567, Salam Ali, your fee is due Friday.&#10;03007654321, Salam Sara, your fee is due Monday."></textarea>
      <div class="hint">Separate the number from the message with a comma or a tab. Pasting two spreadsheet columns works. <span id="each-n"></span></div>
    </div>

    <div class="row">
      <button class="primary" id="send">Send</button>
      <label id="skip-wrap" hidden style="margin:0;font-weight:400"><input type="checkbox" id="skip"> Skip invalid numbers instead of rejecting all</label>
    </div>
    <div id="result"></div>
  </section>

  <section class="card">
    <div class="row" style="margin:0 0 8px;justify-content:space-between">
      <h2 style="margin:0">Recent jobs</h2>
      <button class="small ghost" id="refresh">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Job</th><th>State</th><th>Progress</th><th class="hide-sm">Created</th><th></th></tr></thead>
      <tbody id="jobs"><tr><td colspan="5" class="reason">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let tab = "one";
let open = null; // job id whose messages are shown

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// The browser sends the username and password it asked for on page load.
async function api(method, path, body) {
  const headers = {};
  if (body) {
    headers["Content-Type"] = "application/json";
    headers["Idempotency-Key"] = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
  }
  const res = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) location.reload(); // signed out: let the browser ask again
  return { ok: res.ok, status: res.status, data };
}

// Segment count, matching the server: GSM-7 is 160 per SMS (153 per part),
// anything outside it switches the message to UCS-2, 70 per SMS (67 per part).
const GSM = "@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà";
const GSM_EXT = "\f^{}\\[~]|€";
function segments(text) {
  const chars = [...text];
  const gsm = chars.every((c) => GSM.includes(c) || GSM_EXT.includes(c));
  const widths = chars.map((c) => (gsm ? (GSM_EXT.includes(c) ? 2 : 1) : c.length));
  const units = widths.reduce((a, b) => a + b, 0);
  const [single, part] = gsm ? [160, 153] : [70, 67];
  let n = units === 0 ? 0 : 1;
  if (units > single) {
    let cur = 0;
    for (const w of widths) { if (cur + w > part) { n++; cur = 0; } cur += w; }
  }
  return { units, n, enc: gsm ? "GSM-7" : "UCS-2 (Urdu/emoji)" };
}
document.querySelectorAll("[data-count]").forEach((ta) => {
  const update = () => {
    const s = segments(ta.value);
    $(ta.dataset.count).textContent = ta.value ? `${s.units} characters · ${s.n} SMS · ${s.enc}` : "";
  };
  ta.addEventListener("input", update);
});

function numbers(text) {
  return text.split(/[\n,;]+/).map((s) => s.trim()).filter(Boolean);
}
function pairs(text) {
  return text.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
    const m = line.match(/^([^,\t]+)[,\t]\s*(.*)$/);
    return m ? { to: m[1].trim(), body: m[2] } : { to: line, body: "" };
  });
}
$("same-to").addEventListener("input", () => { const n = numbers($("same-to").value).length; $("same-n").textContent = n ? `${n} number(s)` : ""; });
$("each-lines").addEventListener("input", () => { const n = pairs($("each-lines").value).length; $("each-n").textContent = n ? `${n} message(s).` : ""; });

document.querySelectorAll(".tab").forEach((b) => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
    document.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== tab));
    $("skip-wrap").hidden = tab === "one";
    $("result").innerHTML = "";
  };
});

$("send").onclick = async () => {
  let path, body;
  if (tab === "one") {
    path = "/api/send";
    body = { to: $("one-to").value, body: $("one-body").value };
  } else if (tab === "same") {
    path = "/api/bulk";
    body = { to: numbers($("same-to").value), body: $("same-body").value, skip_invalid: $("skip").checked };
  } else {
    path = "/api/bulk";
    body = { messages: pairs($("each-lines").value), skip_invalid: $("skip").checked };
  }
  $("send").disabled = true;
  try {
    const r = await api("POST", path, body);
    const d = r.data;
    let html;
    if (r.ok) {
      const queued = d.counts?.queued ?? 0;
      html = `<div class="msg ok">Queued ${queued} message(s) as job <span class="mono">${esc(d.id)}</span>.`;
      if (d.skipped?.length) html += ` Skipped ${d.skipped.length}:<ul>${d.skipped.map((p) => `<li>#${p.index} ${esc(p.to)}: ${esc(p.error)}</li>`).join("")}</ul>`;
      html += "</div>";
      open = d.id;
    } else {
      html = `<div class="msg bad">${esc(d.error || "Request failed (" + r.status + ")")}`;
      if (d.invalid?.length) html += `<ul>${d.invalid.map((p) => `<li>#${p.index} ${esc(p.to)}: ${esc(p.error)}</li>`).join("")}</ul>`;
      html += "</div>";
    }
    $("result").innerHTML = html;
    refresh();
  } catch (e) {
    $("result").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`;
  } finally {
    $("send").disabled = false;
  }
};

function progress(c) {
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  const done = (c.sent || 0) + (c.delivered || 0);
  const bad = (c.failed || 0) + (c.expired || 0);
  return `${done}/${total}` + (bad ? ` <span class="s-failed">· ${bad} failed</span>` : "");
}

async function renderJobs() {
  const r = await api("GET", "/api/jobs");
  if (!r.ok) {
    $("jobs").innerHTML = `<tr><td colspan="5" class="reason">${esc(r.data.error || "Could not load jobs")}</td></tr>`;
    return;
  }
  const jobs = r.data.jobs;
  if (!jobs.length) {
    $("jobs").innerHTML = `<tr><td colspan="5" class="reason">No jobs yet.</td></tr>`;
    return;
  }
  let detail = null;
  if (open && jobs.some((j) => j.id === open)) detail = (await api("GET", "/api/jobs/" + open)).data;
  $("jobs").innerHTML = jobs.map((j) => {
    const act = ["queued", "running", "paused", "stopped"].includes(j.state)
      ? `<button class="small ghost" data-act="cancel" data-id="${esc(j.id)}">Cancel</button>` : "";
    const res = ["paused", "stopped"].includes(j.state)
      ? `<button class="small" data-act="resume" data-id="${esc(j.id)}">Resume</button>` : "";
    let row = `<tr class="job" data-id="${esc(j.id)}">
      <td><span class="mono">${esc(j.id)}</span><div class="reason">${j.kind === "send" ? "single" : "bulk"}</div></td>
      <td><span class="state s-${esc(j.state)}">${esc(j.state)}</span>${j.reason ? `<div class="reason">${esc(j.reason)}</div>` : ""}</td>
      <td>${progress(j.counts)}</td>
      <td class="hide-sm">${new Date(j.created_at).toLocaleString()}</td>
      <td style="white-space:nowrap">${res} ${act}</td></tr>`;
    if (detail && detail.id === j.id) {
      row += `<tr class="detail"><td colspan="5"><table><thead><tr><th>#</th><th>To</th><th>State</th><th class="hide-sm">SMS</th></tr></thead><tbody>` +
        (detail.messages || []).map((m) => `<tr><td>${m.index}</td><td class="mono">${esc(m.to)}</td><td><span class="state s-${esc(m.state)}">${esc(m.state)}</span>${m.error ? `<div class="reason">${esc(m.error)}</div>` : ""}</td><td class="hide-sm">${m.segments}</td></tr>`).join("") +
        `</tbody></table></td></tr>`;
    }
    return row;
  }).join("");
}

$("jobs").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (btn) {
    e.stopPropagation();
    if (btn.dataset.act === "cancel" && !confirm("Cancel job " + btn.dataset.id + "? Unsent messages will be dropped.")) return;
    await api("POST", `/api/jobs/${btn.dataset.id}/${btn.dataset.act}`);
    return refresh();
  }
  const row = e.target.closest("tr.job");
  if (row) { open = open === row.dataset.id ? null : row.dataset.id; renderJobs(); }
});

async function renderStatus() {
  const r = await api("GET", "/api/status");
  if (!r.ok) { $("status").innerHTML = ""; return; }
  const s = r.data;
  $("status").innerHTML =
    `<span class="chip ${s.gateway === "ok" ? "ok" : "bad"}" title="${esc(s.gateway)}">${s.gateway === "ok" ? "Phone connected" : "Phone not connected"}</span>` +
    `<span class="chip">SIM ${s.sim}</span>` +
    `<span class="chip" title="Segments used today">Today ${esc(s.today)}</span>` +
    `<span class="chip" title="Segments in the last 15 minutes">15 min ${esc(s.last_15m)}</span>`;
}

async function refresh() {
  await Promise.all([renderStatus(), renderJobs()]);
}
$("refresh").onclick = refresh;
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
refresh();
</script>
</body>
</html>
